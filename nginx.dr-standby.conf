server {
    listen 127.0.0.1:18080;
    server_name _;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://w.soundcloud.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://vocadb.net https://*.vocadb.net; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://embed.nicovideo.jp https://w.soundcloud.com https://player.bilibili.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location ^~ /diva-player/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://w.soundcloud.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://vocadb.net https://*.vocadb.net; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://embed.nicovideo.jp https://w.soundcloud.com https://player.bilibili.com; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    location = /diva-player/index.html {
        alias /usr/share/nginx/html/diva-player/index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://w.soundcloud.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://vocadb.net https://*.vocadb.net; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://embed.nicovideo.jp https://w.soundcloud.com https://player.bilibili.com; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    location /diva-player/ {
        alias /usr/share/nginx/html/diva-player/;
        try_files $uri $uri/ /diva-player/index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://w.soundcloud.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://vocadb.net https://*.vocadb.net; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://embed.nicovideo.jp https://w.soundcloud.com https://player.bilibili.com; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    location = / {
        return 301 /diva-player/;
    }

    location /backend-api/ {
        proxy_pass http://127.0.0.1:15000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location ~ ^/invidious-api/api/v1/playlists/[A-Za-z0-9_-]\{8,100\}$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        rewrite ^/invidious-api/(.*)$ /$1 break;
        proxy_pass https://inv.nadeko.net;
        proxy_set_header Host inv.nadeko.net;
        proxy_ssl_server_name on;
    }

    location /invidious-api/ {
        return 404;
    }
}
