server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Vite filenames are content hashed. Keep them across visits while forcing
    # the HTML entry point to revalidate so it never references an old graph.
    location ^~ /diva-player/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /diva-player/index.html {
        alias /usr/share/nginx/html/diva-player/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Frontend static files
    location /diva-player/ {
        alias /usr/share/nginx/html/diva-player/;
        try_files $uri $uri/ /diva-player/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Redirect root to /diva-player/
    location = / {
        return 301 /diva-player/;
    }

    # Proxy backend API requests
    location /backend-api/ {
        proxy_pass http://api_gateway:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not retain a caller-supplied forwarding chain. The API gateway
        # trusts this value only from the internal Docker network.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Proxy only the playlist endpoint used by the import UI.
    location ~ ^/invidious-api/api/v1/playlists/[A-Za-z0-9_-]\{8,100\}$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        rewrite ^/invidious-api/(.*)$ /$1 break;
        proxy_pass https://inv.nadeko.net;
        proxy_set_header Host inv.nadeko.net;
        proxy_ssl_server_name on;
    }

    location /invidious-api/ {
        return 404;
    }
}
