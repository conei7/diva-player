server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Frontend static files
    location /diva-player/ {
        alias /usr/share/nginx/html/diva-player/;
        try_files $uri $uri/ /diva-player/index.html;
    }

    # Redirect root to /diva-player/
    location = / {
        return 301 /diva-player/;
    }

    # Proxy backend API requests
    location /backend-api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy only the playlist endpoint used by the import UI.
    location ~ ^/invidious-api/api/v1/playlists/[A-Za-z0-9_-]\{8,100\}$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($arg_page != "" && $arg_page !~ ^([1-9]|[1-4][0-9]|50)$) { return 400; }
        rewrite ^/invidious-api/(.*)$ /$1 break;
        proxy_pass https://inv.nadeko.net;
        proxy_set_header Host inv.nadeko.net;
        proxy_ssl_server_name on;
    }

    location /invidious-api/ {
        return 404;
    }
}
