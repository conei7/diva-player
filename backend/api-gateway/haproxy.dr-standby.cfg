global
    log stdout format raw local0
    stats socket /tmp/haproxy-dr-admin.sock mode 660 level admin
    maxconn 128

defaults
    log global
    mode http
    option httplog
    option redispatch
    retries 2
    timeout connect 2s
    timeout queue 2s
    timeout http-request 10s
    timeout client 55s
    timeout server 55s

frontend api_front
    bind 127.0.0.1:15000
    maxconn 64

    # Every valid upstream in the DR topology is on this isolated WSL host.
    # Replace caller-supplied forwarding data unless it came from the local Web
    # proxy, then install the same authenticated gateway marker as production.
    acl from_local src 127.0.0.1
    http-request set-var(txn.client_ip) src
    http-request set-var(txn.client_ip) req.hdr(X-Forwarded-For) if from_local { req.hdr(X-Forwarded-For) -m found }
    http-request set-header X-Forwarded-For %[var(txn.client_ip)]
    http-request del-header X-Diva-Balance-Key
    http-request set-var(txn.balance_key) var(txn.client_ip)
    http-request set-var(txn.balance_key) req.hdr(CF-Connecting-IP) if { req.hdr(CF-Connecting-IP) -m found }
    http-request set-header X-Diva-Balance-Key %[var(txn.balance_key)]
    http-request del-header X-Diva-Gateway-Proxy
    http-request del-header X-Diva-Gateway-Proxy-Key
    http-request set-header X-Diva-Gateway-Proxy 1
    http-request set-header X-Diva-Gateway-Proxy-Key "${GATEWAY_PROXY_KEY}"
    default_backend api_nodes

backend api_nodes
    balance hdr(X-Diva-Balance-Key)
    option httpchk
    http-check send meth GET uri /api/ready
    http-check expect status 200
    http-response set-header X-Diva-Api-Slot %[srv_name]
    server api_a 127.0.0.1:15001 maxconn 32 check inter 2s fastinter 500ms downinter 500ms fall 2 rise 2
    server api_b 127.0.0.1:15002 maxconn 32 check inter 2s fastinter 500ms downinter 500ms fall 2 rise 2
