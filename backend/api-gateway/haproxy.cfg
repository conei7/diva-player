global
    log stdout format raw local0
    stats socket /var/run/haproxy/admin.sock mode 660 level admin

defaults
    log global
    mode http
    option httplog
    option redispatch
    retries 2
    timeout connect 3s
    timeout client 65s
    timeout server 65s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend api_front
    bind :5000

    # Preserve the address set by the internal web proxy, but replace any
    # forwarding header received directly from LAN/public clients.
    acl from_docker src 172.16.0.0/12
    http-request set-var(txn.client_ip) src
    http-request set-var(txn.client_ip) req.hdr(X-Forwarded-For),field(1,','),trim if from_docker { req.hdr(X-Forwarded-For) -m found }
    http-request set-header X-Forwarded-For %[var(txn.client_ip)]

    # Keep one client on one API slot so the in-process fixed-window limiter
    # and hot caches retain their single-instance semantics. Failover still
    # moves the client to the remaining healthy slot.
    http-request del-header X-Diva-Balance-Key
    http-request set-var(txn.balance_key) var(txn.client_ip)
    http-request set-var(txn.balance_key) req.hdr(CF-Connecting-IP) if { req.hdr(CF-Connecting-IP) -m found }
    http-request set-header X-Diva-Balance-Key %[var(txn.balance_key)]

    http-request del-header X-Diva-Gateway-Proxy
    http-request del-header X-Diva-Gateway-Proxy-Key
    http-request set-header X-Diva-Gateway-Proxy 1
    http-request set-header X-Diva-Gateway-Proxy-Key "${GATEWAY_PROXY_KEY}"
    default_backend api_nodes

backend api_nodes
    balance hdr(X-Diva-Balance-Key)
    option httpchk
    http-check send meth GET uri /api/ready
    http-check expect status 200
    http-response set-header X-Diva-Api-Slot %[srv_name]
    server api_a api_a:5000 check resolvers docker init-addr libc,none inter 2s fastinter 500ms downinter 500ms fall 2 rise 2
    server api_b api_b:5000 check resolvers docker init-addr libc,none inter 2s fastinter 500ms downinter 500ms fall 2 rise 2
