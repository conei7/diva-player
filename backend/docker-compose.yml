x-api-environment: &api-environment
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=vocadb_recommender;Username=vocadb;Password=vocadb_secret;Maximum Pool Size=16;Timeout=5;Application Name=diva-api"
  Recommender__QdrantEndpoint: "http://qdrant:6334"
  Recommender__YouTubeApiKey: "${YOUTUBE_API_KEY:-}"
  Recommender__PagesProxyKey: "${PAGES_PROXY_KEY:-}"
  Recommender__YouTubePlaylistCacheHours: "6"
  Recommender__NicoPlaylistCacheHours: "6"
  Recommender__SearchCacheSizeMiB: "64"
  Recommender__SearchCacheEntrySizeMiB: "8"
  Recommender__ObjectCacheSizeMiB: "64"
  Recommender__ObjectCacheEntrySizeMiB: "16"
  ASPNETCORE_URLS: "http://+:5000"
  ASPNETCORE_ENVIRONMENT: "Production"

x-api-common: &api-common
  image: diva-player-api:local
  build:
    context: ./api
    dockerfile: Dockerfile
  environment: *api-environment
  expose:
    - "5000"
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    qdrant:
      condition: service_started
  healthcheck:
    test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:5000/api/ready"]
    interval: 5s
    timeout: 6s
    retries: 12
    start_period: 10s
  stop_grace_period: 30s
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vocadb_postgres
    # VACUUM and vector operations can exceed Docker's 64 MiB default /dev/shm.
    shm_size: "1gb"
    environment:
      POSTGRES_USER: vocadb
      POSTGRES_PASSWORD: vocadb_secret
      POSTGRES_DB: vocadb_recommender
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocadb -d vocadb_recommender"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: vocadb_qdrant
    ports:
      - "127.0.0.1:6333:6333"   # HTTP REST API
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: vocadb_recommender
      PGUSER: vocadb
      PGPASSWORD: vocadb_secret
    volumes:
      - ./database/migrate.sh:/migrations/migrate.sh:ro
      - ./database/migrations:/migrations/sql:ro
    entrypoint: ["sh", "/migrations/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api_a:
    <<: *api-common
    container_name: vocadb_api_a
    environment:
      <<: *api-environment
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=vocadb_recommender;Username=vocadb;Password=vocadb_secret;Maximum Pool Size=16;Timeout=5;Application Name=diva-api-a"

  api_b:
    <<: *api-common
    container_name: vocadb_api_b
    environment:
      <<: *api-environment
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=vocadb_recommender;Username=vocadb;Password=vocadb_secret;Maximum Pool Size=16;Timeout=5;Application Name=diva-api-b"

  api_gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: vocadb_api_gateway
    environment:
      GATEWAY_PROXY_KEY: "${PAGES_PROXY_KEY:-}"
    ports:
      - "5000:5000"
    depends_on:
      api_a:
        condition: service_healthy
      api_b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:5000/api/ready"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ../
      dockerfile: Dockerfile.web
    container_name: vocadb_web
    ports:
      - "8080:80"
    depends_on:
      - api_gateway
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
