x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-api-environment: &api-environment
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=vocadb_recommender;Username=${DIVA_API_DB_USER:?DIVA_API_DB_USER is required};Password=${DIVA_API_DB_PASSWORD:?DIVA_API_DB_PASSWORD is required};Maximum Pool Size=16;Timeout=5;Application Name=diva-api"
  Recommender__QdrantEndpoint: "http://qdrant:6334"
  Recommender__QdrantRestEndpoint: "http://qdrant:6333"
  Recommender__YouTubeApiKey: "${YOUTUBE_API_KEY:-}"
  Recommender__PagesProxyKey: "${PAGES_PROXY_KEY:?PAGES_PROXY_KEY is required}"
  Recommender__YouTubePlaylistCacheHours: "6"
  Recommender__NicoPlaylistCacheHours: "6"
  Recommender__SearchCacheSizeMiB: "64"
  Recommender__SearchCacheEntrySizeMiB: "8"
  Recommender__ObjectCacheSizeMiB: "64"
  Recommender__ObjectCacheEntrySizeMiB: "16"
  # Per API slot. Foreground database fan-out is capped at pool minus reserve,
  # leaving readiness 2, maintenance 1, and publication guard 1.
  Recommender__Bulkhead__AggregatePermitLimit: "${DIVA_API_AGGREGATE_CONCURRENCY:-6}"
  Recommender__Bulkhead__DatabaseConnectionReserve: "${DIVA_API_DB_CONNECTION_RESERVE:-4}"
  Recommender__Bulkhead__HeavyPermitLimit: "${DIVA_API_HEAVY_CONCURRENCY:-6}"
  Recommender__Bulkhead__HeavyQueueLimit: "${DIVA_API_HEAVY_QUEUE:-6}"
  Recommender__Bulkhead__StandardPermitLimit: "${DIVA_API_STANDARD_CONCURRENCY:-6}"
  Recommender__Bulkhead__StandardQueueLimit: "${DIVA_API_STANDARD_QUEUE:-8}"
  Recommender__Bulkhead__ProviderPermitLimit: "${DIVA_API_PROVIDER_CONCURRENCY:-2}"
  Recommender__Bulkhead__ProviderQueueLimit: "${DIVA_API_PROVIDER_QUEUE:-2}"
  Recommender__Bulkhead__QueueTimeoutMilliseconds: "${DIVA_API_QUEUE_TIMEOUT_MS:-1500}"
  ASPNETCORE_URLS: "http://+:5000"
  ASPNETCORE_ENVIRONMENT: "Production"

x-api-common: &api-common
  # The deploy script overrides this with the preserved rollback tag while
  # restoring a failed slot. Normal compose usage keeps the local tag.
  image: "${DIVA_API_IMAGE:-diva-player-api:local}"
  build:
    context: ./api
    dockerfile: Dockerfile
  environment: *api-environment
  expose:
    - "5000"
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    qdrant:
      condition: service_started
  healthcheck:
    test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:5000/api/ready"]
    interval: 5s
    timeout: 6s
    retries: 12
    # Ranking warmup deliberately finishes before readiness. Keep Docker in
    # `starting` while a cold history scan runs; the rolling script has the
    # same 180-second fail-closed deadline and accepts success immediately.
    start_period: 180s
  stop_grace_period: 30s
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges=true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  # API RSS has remained below 140 MiB in production observations. Reserve
  # headroom without allowing a runaway process to consume the SBC with the
  # database and vector store.
  mem_reservation: "256m"
  mem_limit: "768m"
  pids_limit: 256
  restart: unless-stopped
  logging: *default-logging

services:
  postgres:
    # The stateful hardener publishes this locally only after the exact image
    # ID passes the vulnerability and runtime-contract gates.  Ordinary
    # deployments must never pull or rebuild a stateful image implicitly.
    image: "${DIVA_POSTGRES_IMAGE:-diva-player-postgres:16.15-pgvector-0.8.6-hardened-r1}"
    pull_policy: never
    container_name: vocadb_postgres
    # VACUUM and vector operations can exceed Docker's 64 MiB default /dev/shm.
    shm_size: "1gb"
    environment:
      POSTGRES_USER: "${DIVA_DB_ADMIN_USER:-vocadb}"
      POSTGRES_PASSWORD: "${DIVA_DB_ADMIN_PASSWORD:?DIVA_DB_ADMIN_PASSWORD is required}"
      POSTGRES_DB: vocadb_recommender
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DIVA_DB_ADMIN_USER:-vocadb} -d vocadb_recommender"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      # Required only by the image entrypoint while it fixes data-directory
      # ownership and drops from root to the configured database account.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges=true
    stop_grace_period: 60s
    pids_limit: 512
    logging: *default-logging

  qdrant:
    # This tag is published once by scripts/harden-sbc-stateful-services.sh.
    # Compose intentionally has no build block so an ordinary deployment
    # cannot replace the audited image through a mutable APT result.
    image: diva-player-qdrant:v1.19.0-hardened-r1
    pull_policy: never
    container_name: vocadb_qdrant
    user: "1000:1000"
    ports:
      - "127.0.0.1:6333:6333"   # HTTP REST API
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT__TELEMETRY_DISABLED: "true"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    mem_limit: "8g"
    pids_limit: 512
    stop_grace_period: 120s
    restart: unless-stopped
    logging: *default-logging

  migrate:
    # Production deployment resolves these read-only mounts from a private,
    # root-owned snapshot of the reviewed Git tree.  Keeping SQL outside the
    # generic audited psql image avoids rebuilding a stateful helper for every
    # forward-compatible schema migration.
    image: "${DIVA_POSTGRES_MIGRATE_IMAGE:-diva-player-postgres-migrate:16.15-hardened-r1}"
    pull_policy: never
    user: "65534:65534"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: vocadb_recommender
      PGUSER: "${DIVA_DB_ADMIN_USER:-vocadb}"
      PGPASSWORD: "${DIVA_DB_ADMIN_PASSWORD:?DIVA_DB_ADMIN_PASSWORD is required}"
    volumes:
      - ./database/migrate.sh:/migrations/migrate.sh:ro
      - ./database/migrations:/migrations/sql:ro
    entrypoint: ["sh", "/migrations/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    mem_limit: "256m"
    pids_limit: 128
    restart: "no"
    logging: *default-logging

  api_a:
    <<: *api-common
    container_name: vocadb_api_a
    environment:
      <<: *api-environment
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=vocadb_recommender;Username=${DIVA_API_DB_USER:?DIVA_API_DB_USER is required};Password=${DIVA_API_DB_PASSWORD:?DIVA_API_DB_PASSWORD is required};Maximum Pool Size=16;Timeout=5;Application Name=diva-api-a"

  api_b:
    <<: *api-common
    container_name: vocadb_api_b
    environment:
      <<: *api-environment
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=vocadb_recommender;Username=${DIVA_API_DB_USER:?DIVA_API_DB_USER is required};Password=${DIVA_API_DB_PASSWORD:?DIVA_API_DB_PASSWORD is required};Maximum Pool Size=16;Timeout=5;Application Name=diva-api-b"

  api_gateway:
    # Keep the gateway image addressable as well as buildable. This lets the
    # rolling deploy validate a candidate and restore the previous image if
    # the replacement cannot become ready.
    image: "${DIVA_GATEWAY_IMAGE:-diva-player-api-gateway:local}"
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: vocadb_api_gateway
    environment:
      GATEWAY_PROXY_KEY: "${PAGES_PROXY_KEY:?PAGES_PROXY_KEY is required}"
    ports:
      - "5000:5000"
    depends_on:
      api_a:
        condition: service_healthy
      api_b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:5000/api/ready"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_reservation: "64m"
    mem_limit: "256m"
    pids_limit: 128
    restart: unless-stopped
    logging: *default-logging

  web:
    image: "${DIVA_WEB_IMAGE:-diva-player-web:local}"
    build:
      context: ../
      dockerfile: Dockerfile.web
    container_name: vocadb_web
    user: "101:101"
    ports:
      - "8080:8080"
    depends_on:
      - api_gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/backend-api/api/ready"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_reservation: "64m"
    mem_limit: "256m"
    pids_limit: 128
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  # The one-time v1.9 -> v1.19 stateful upgrade writes the exact, verified
  # run-unique candidate volume into owner-only backend/.env.  A default keeps
  # fresh development checkouts usable, while production is durably pinned
  # and cannot silently fall back to the byte-preserved v1.9 rollback volume.
  qdrant_data:
    name: "${DIVA_QDRANT_VOLUME:-backend_qdrant_data}"
