x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-api-environment: &api-environment
  ConnectionStrings__Postgres: "Host=127.0.0.1;Port=5432;Database=diva_standby;Username=${DIVA_API_DB_USER:?DIVA_API_DB_USER is required};Password=${DIVA_API_DB_PASSWORD:?DIVA_API_DB_PASSWORD is required};Maximum Pool Size=8;Timeout=5;Application Name=diva-dr-api"
  Recommender__QdrantEndpoint: "http://127.0.0.1:16334"
  Recommender__QdrantRestEndpoint: "http://127.0.0.1:16333"
  Recommender__YouTubeApiKey: "${YOUTUBE_API_KEY:-}"
  Recommender__PagesProxyKey: "${PAGES_PROXY_KEY:?PAGES_PROXY_KEY is required}"
  Recommender__YouTubePlaylistCacheHours: "6"
  Recommender__NicoPlaylistCacheHours: "6"
  Recommender__SearchCacheSizeMiB: "64"
  Recommender__SearchCacheEntrySizeMiB: "8"
  Recommender__ObjectCacheSizeMiB: "64"
  Recommender__ObjectCacheEntrySizeMiB: "16"
  # The standby pool has eight connections per slot. Foreground fan-out is
  # capped at four, preserving readiness 2, maintenance 1, and guard 1.
  Recommender__Bulkhead__AggregatePermitLimit: "3"
  Recommender__Bulkhead__DatabaseConnectionReserve: "4"
  Recommender__Bulkhead__HeavyPermitLimit: "3"
  Recommender__Bulkhead__HeavyQueueLimit: "3"
  Recommender__Bulkhead__StandardPermitLimit: "3"
  Recommender__Bulkhead__StandardQueueLimit: "4"
  Recommender__Bulkhead__ProviderPermitLimit: "1"
  Recommender__Bulkhead__ProviderQueueLimit: "1"
  Recommender__Bulkhead__QueueTimeoutMilliseconds: "1000"
  ASPNETCORE_ENVIRONMENT: "Production"

x-api-common: &api-common
  image: "diva-player-dr-api:local"
  network_mode: host
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges=true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  stop_grace_period: 30s
  mem_reservation: "128m"
  mem_limit: "384m"
  pids_limit: 128
  restart: unless-stopped
  logging: *default-logging

services:
  api_a:
    <<: *api-common
    container_name: diva_dr_api_a
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      <<: *api-environment
      ASPNETCORE_URLS: "http://127.0.0.1:15001"
      ConnectionStrings__Postgres: "Host=127.0.0.1;Port=5432;Database=diva_standby;Username=${DIVA_API_DB_USER:?DIVA_API_DB_USER is required};Password=${DIVA_API_DB_PASSWORD:?DIVA_API_DB_PASSWORD is required};Maximum Pool Size=8;Timeout=5;Application Name=diva-dr-api-a"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:15001/api/ready"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 180s

  api_b:
    <<: *api-common
    container_name: diva_dr_api_b
    environment:
      <<: *api-environment
      ASPNETCORE_URLS: "http://127.0.0.1:15002"
      ConnectionStrings__Postgres: "Host=127.0.0.1;Port=5432;Database=diva_standby;Username=${DIVA_API_DB_USER:?DIVA_API_DB_USER is required};Password=${DIVA_API_DB_PASSWORD:?DIVA_API_DB_PASSWORD is required};Maximum Pool Size=8;Timeout=5;Application Name=diva-dr-api-b"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:15002/api/ready"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 180s

  api_gateway:
    image: "diva-player-dr-api-gateway:local"
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: diva_dr_api_gateway
    network_mode: host
    environment:
      GATEWAY_PROXY_KEY: "${PAGES_PROXY_KEY:?PAGES_PROXY_KEY is required}"
    volumes:
      - ./api-gateway/haproxy.dr-standby.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:15000/api/ready"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 185s
    mem_reservation: "32m"
    mem_limit: "128m"
    pids_limit: 64
    restart: unless-stopped
    logging: *default-logging

  web:
    image: "diva-player-dr-web:local"
    build:
      context: ../
      dockerfile: Dockerfile.web
    container_name: diva_dr_web
    network_mode: host
    volumes:
      - ../nginx.dr-standby.conf:/etc/nginx/conf.d/default.conf:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges=true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18080/backend-api/api/ready"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 190s
    mem_reservation: "32m"
    mem_limit: "128m"
    pids_limit: 64
    restart: unless-stopped
    logging: *default-logging
