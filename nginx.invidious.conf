# Keep the upstream at an API-only boundary on the application's origin.
location ~ "^/invidious-api/api/v1/playlists/[A-Za-z0-9_-]{8,100}$" {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($args !~ "^(page=0*([1-9]|[1-4][0-9]|50))?$") { return 400; }
    rewrite ^/invidious-api/(.*)$ /$1 break;
    proxy_pass https://inv.nadeko.net;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host inv.nadeko.net;
    proxy_set_header Accept application/json;

    proxy_ignore_headers X-Accel-Redirect X-Accel-Charset X-Accel-Buffering X-Accel-Limit-Rate X-Accel-Expires;
    proxy_hide_header Content-Type;
    proxy_hide_header Content-Disposition;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Set-Cookie2;
    proxy_hide_header Clear-Site-Data;
    proxy_hide_header Location;
    proxy_hide_header Refresh;
    proxy_hide_header Link;
    proxy_hide_header WWW-Authenticate;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header ETag;
    proxy_hide_header Last-Modified;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Alt-Svc;
    proxy_hide_header NEL;
    proxy_hide_header Report-To;
    proxy_hide_header Reporting-Endpoints;
    proxy_hide_header Origin-Trial;
    proxy_hide_header Accept-CH;
    proxy_hide_header Critical-CH;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;

    proxy_intercept_errors on;
    error_page 300 301 302 303 305 307 308 =502 /_diva_invidious_error;
    add_header Content-Type "application/json; charset=utf-8";
    add_header Content-Disposition attachment always;
    add_header Content-Security-Policy "sandbox; default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
}

location = /_diva_invidious_error {
    internal;
    default_type application/json;
    add_header Content-Security-Policy "sandbox; default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    return 502 '{"error":"invalid playlist upstream response"}';
}

location /invidious-api/ {
    return 404;
}
