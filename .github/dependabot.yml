version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: typescript
        # typescript-eslint currently caps its TypeScript peer range below 6.1.
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: /backend/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      nuget-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
