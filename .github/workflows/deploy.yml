name: Deploy DIVA Player

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

jobs:
  cloudflare_contract:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      compatibility_date: ${{ steps.inspect.outputs.compatibility_date }}
      compatibility_flags_json: ${{ steps.inspect.outputs.compatibility_flags_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare release inspection requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
      - name: Inspect live Cloudflare release contract
        id: inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/cloudflare-pages-release.mjs inspect-project \
            --project diva-player \
            --github-output "$GITHUB_OUTPUT"
  build:
    if: github.ref == 'refs/heads/main'
    needs: cloudflare_contract
    runs-on: ubuntu-latest
    # Stateful/DR fault matrices intentionally exercise bounded timeout,
    # rollback, and daemon-settlement paths before the container scans and E2E
    # release gates. Keep a finite ceiling without turning a healthy, complete
    # security run into a false timeout on a slower hosted runner.
    timeout-minutes: 240
    outputs:
      release_sha256: ${{ steps.release_artifact.outputs.release_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Build and start exact PostgreSQL CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          postgres_dockerfile_sha256=$(sha256sum backend/database/Dockerfile.pgvector | awk '{print $1}')
          postgres_schema_sha256=$(sha256sum backend/database/schema.sql | awk '{print $1}')
          postgres_build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          postgres_attestation="$RUNNER_TEMP/postgres-source-bundle.attestation"
          printf '%s\n' \
            "dockerfile.sha256=$postgres_dockerfile_sha256" \
            'pgvector.archive.sha256=d076a3098010905fd60256649327809651f6288327db6413f0938305f62ea299' \
            'pgvector.commit=8ee86c96f0fd72390f890aa8a336fda6d3ab4c6c' \
            "schema.sha256=$postgres_schema_sha256" \
            > "$postgres_attestation"
          postgres_source_bundle_sha256=$(sha256sum "$postgres_attestation" | awk '{print $1}')
          migrate_dockerfile_sha256=$(sha256sum backend/database/Dockerfile.migrate | awk '{print $1}')
          migrate_build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          docker build --pull --file backend/database/Dockerfile.pgvector \
            --build-arg "DIVA_POSTGRES_DOCKERFILE_SHA256=$postgres_dockerfile_sha256" \
            --build-arg "DIVA_POSTGRES_BUILD_TIMESTAMP=$postgres_build_timestamp" \
            --build-arg "DIVA_POSTGRES_SCHEMA_SHA256=$postgres_schema_sha256" \
            --build-arg "DIVA_POSTGRES_SOURCE_BUNDLE_SHA256=$postgres_source_bundle_sha256" \
            --tag diva-player-ci-postgres:current backend/database
          docker build --pull --file backend/database/Dockerfile.migrate \
            --build-arg "DIVA_POSTGRES_MIGRATE_DOCKERFILE_SHA256=$migrate_dockerfile_sha256" \
            --build-arg "DIVA_POSTGRES_MIGRATE_BUILD_TIMESTAMP=$migrate_build_timestamp" \
            --tag diva-player-ci-postgres-migrate:current backend/database

          postgres_image_id=$(docker image inspect --format '{{.Id}}' diva-player-ci-postgres:current)
          migrate_image_id=$(docker image inspect --format '{{.Id}}' diva-player-ci-postgres-migrate:current)
          [[ "$postgres_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$migrate_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect --format '{{.Architecture}}/{{.Os}}' "$postgres_image_id")" = amd64/linux
          test "$(docker image inspect --format '{{.Architecture}}/{{.Os}}' "$migrate_image_id")" = amd64/linux
          test "$(docker image inspect --format '{{index .Config.Labels "com.diva.postgres.dockerfile-sha256"}}' "$postgres_image_id")" = "$postgres_dockerfile_sha256"
          test "$(docker image inspect --format '{{index .Config.Labels "com.diva.postgres.schema-sha256"}}' "$postgres_image_id")" = "$postgres_schema_sha256"
          test "$(docker image inspect --format '{{index .Config.Labels "com.diva.postgres.source-bundle-sha256"}}' "$postgres_image_id")" = "$postgres_source_bundle_sha256"
          test "$(docker image inspect --format '{{index .Config.Labels "com.diva.postgres.runtime-contract"}}' "$postgres_image_id")" = alpine-root-init-su-exec-uid999-v1
          test "$(docker image inspect --format '{{index .Config.Labels "com.diva.postgres-migrate.dockerfile-sha256"}}' "$migrate_image_id")" = "$migrate_dockerfile_sha256"
          test "$(docker image inspect --format '{{index .Config.Labels "com.diva.postgres-migrate.runtime-contract"}}' "$migrate_image_id")" = rootless-readonly-psql-client-v1
          test "$(docker image inspect --format '{{.Config.User}}' "$migrate_image_id")" = 65534:65534
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$migrate_image_id")" = '["psql"]'

          run_ci_psql() {
            docker run --rm --network host --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 64 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
              --env PGHOST=127.0.0.1 --env PGPORT=5432 \
              --env PGDATABASE=vocadb_recommender --env PGUSER=vocadb \
              --env PGPASSWORD=diva-ci-password --env PGCONNECT_TIMEOUT=5 \
              "$migrate_image_id" -X -v ON_ERROR_STOP=1 "$@"
          }

          postgres_container="diva-player-ci-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          postgres_volume="${postgres_container}-data"
          ! docker container inspect "$postgres_container" >/dev/null 2>&1
          ! docker volume inspect "$postgres_volume" >/dev/null 2>&1
          test "$(docker volume create "$postgres_volume")" = "$postgres_volume"
          postgres_container_id=$(docker run --detach --name "$postgres_container" \
            --read-only --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE \
            --cap-add FOWNER --cap-add SETGID --cap-add SETUID \
            --security-opt no-new-privileges --pids-limit 512 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --tmpfs /var/run/postgresql:rw,nosuid,nodev,size=16m,mode=3777,uid=999,gid=999 \
            --mount "type=volume,src=$postgres_volume,dst=/var/lib/postgresql/data" \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=vocadb \
            --env POSTGRES_PASSWORD=diva-ci-password \
            --env POSTGRES_DB=vocadb_recommender \
            --health-cmd 'pg_isready -U vocadb -d vocadb_recommender' \
            --health-interval 2s --health-timeout 5s --health-retries 60 \
            "$postgres_image_id")
          test "$(docker container inspect --format '{{.Id}}' "$postgres_container")" = "$postgres_container_id"
          test "$(docker container inspect --format '{{.Image}}' "$postgres_container")" = "$postgres_image_id"
          postgres_healthy=false
          for attempt in $(seq 1 90); do
            if [[ $(docker container inspect --format '{{.State.Health.Status}}' "$postgres_container") == healthy ]]; then
              postgres_healthy=true
              break
            fi
            if [[ $(docker container inspect --format '{{.State.Running}}' "$postgres_container") != true ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$postgres_healthy" != true ]]; then
            docker logs "$postgres_container" || true
            exit 1
          fi

          # The official entrypoint starts a temporary Unix-socket server while
          # running initdb scripts. Its in-container pg_isready healthcheck can
          # turn healthy before that server is stopped and the final TCP server
          # is stable. Require PID 1 to have exec'd the final postgres process,
          # two matching external postmaster identities, and the final schema
          # sentinel before starting the fail-stop migration.
          postgres_endpoint_stable=false
          postgres_postmaster_identity=""
          postgres_stable_samples=0
          for attempt in $(seq 1 90); do
            if [[ $(docker container inspect --format '{{.State.Running}}' "$postgres_container") != true ]]; then
              break
            fi
            postgres_main_process=$(docker exec "$postgres_container" cat /proc/1/comm 2>/dev/null || true)
            if [[ "$postgres_main_process" == postgres ]] \
              && postgres_probe=$(run_ci_psql -Atc \
                "SELECT pg_postmaster_start_time()::text || '|' || (SELECT COUNT(*)::text FROM sync_state WHERE key IN ('last_daily_sync', 'dump_imported'))" \
                2>/dev/null) \
              && [[ "$postgres_probe" == *'|2' ]]; then
              postgres_identity=${postgres_probe%|*}
              if [[ "$postgres_identity" == "$postgres_postmaster_identity" ]]; then
                postgres_stable_samples=$((postgres_stable_samples + 1))
              else
                postgres_postmaster_identity="$postgres_identity"
                postgres_stable_samples=1
              fi
              if [[ "$postgres_stable_samples" -ge 2 \
                && $(docker container inspect --format '{{.State.Health.Status}}' "$postgres_container") == healthy ]]; then
                postgres_endpoint_stable=true
                break
              fi
            else
              postgres_postmaster_identity=""
              postgres_stable_samples=0
            fi
            sleep 2
          done
          if [[ "$postgres_endpoint_stable" != true ]]; then
            docker logs "$postgres_container" || true
            exit 1
          fi

          if ! docker run --rm --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --env PGHOST=127.0.0.1 --env PGPORT=5432 \
            --env PGDATABASE=vocadb_recommender --env PGUSER=vocadb \
            --env PGPASSWORD=diva-ci-password \
            --mount "type=bind,src=$GITHUB_WORKSPACE/backend/database/migrate.sh,dst=/migrations/migrate.sh,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/backend/database/migrations,dst=/migrations/sql,readonly" \
            --entrypoint /bin/sh "$migrate_image_id" /migrations/migrate.sh; then
            docker logs "$postgres_container" || true
            exit 1
          fi

          test "$(docker exec --user 0:0 "$postgres_container" \
            stat -c '%u:%g' /var/lib/postgresql/data)" = 999:999
          run_ci_psql -c 'CREATE TABLE IF NOT EXISTS diva_ci_vector_smoke (id INTEGER PRIMARY KEY, embedding vector(3) NOT NULL)'
          run_ci_psql -c "INSERT INTO diva_ci_vector_smoke (id, embedding) VALUES (1, '[1,0,0]'), (2, '[0,1,0]') ON CONFLICT (id) DO UPDATE SET embedding = EXCLUDED.embedding"
          run_ci_psql -c 'CREATE INDEX IF NOT EXISTS diva_ci_vector_smoke_hnsw ON diva_ci_vector_smoke USING hnsw (embedding vector_l2_ops)'
          run_ci_psql -c 'ANALYZE diva_ci_vector_smoke'
          test "$(run_ci_psql -Atc "SELECT id || '|' || round((embedding <-> '[1,0,0]')::numeric, 6) FROM diva_ci_vector_smoke ORDER BY embedding <-> '[1,0,0]' LIMIT 1")" = '1|0.000000'
          run_ci_psql -Atc "SET enable_seqscan = off; EXPLAIN (COSTS OFF) SELECT id FROM diva_ci_vector_smoke ORDER BY embedding <-> '[1,0,0]' LIMIT 1" \
            | grep -F 'Index Scan using diva_ci_vector_smoke_hnsw'

          docker restart --time 30 "$postgres_container" >/dev/null
          postgres_healthy=false
          for attempt in $(seq 1 90); do
            if [[ $(docker container inspect --format '{{.State.Health.Status}}' "$postgres_container") == healthy ]]; then
              postgres_healthy=true
              break
            fi
            if [[ $(docker container inspect --format '{{.State.Running}}' "$postgres_container") != true ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$postgres_healthy" != true ]]; then
            docker logs "$postgres_container" || true
            exit 1
          fi
          test "$(docker container inspect --format '{{.Image}}' "$postgres_container")" = "$postgres_image_id"
          test "$(docker exec --user 0:0 "$postgres_container" \
            stat -c '%u:%g' /var/lib/postgresql/data)" = 999:999
          test "$(run_ci_psql -Atc "SELECT id || '|' || round((embedding <-> '[1,0,0]')::numeric, 6) FROM diva_ci_vector_smoke ORDER BY embedding <-> '[1,0,0]' LIMIT 1")" = '1|0.000000'
          run_ci_psql -Atc "SET enable_seqscan = off; EXPLAIN (COSTS OFF) SELECT id FROM diva_ci_vector_smoke ORDER BY embedding <-> '[1,0,0]' LIMIT 1" \
            | grep -F 'Index Scan using diva_ci_vector_smoke_hnsw'
          test "$(docker image inspect --format '{{.Id}}' diva-player-ci-postgres:current)" = "$postgres_image_id"
          test "$(docker image inspect --format '{{.Id}}' diva-player-ci-postgres-migrate:current)" = "$migrate_image_id"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          cache: 'npm'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.424'
      - name: Install dependencies
        run: npm ci
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Restore locked API dependencies
        run: dotnet restore diva-player.sln --locked-mode
      - name: Build API
        run: dotnet build backend/api/VocadbRecommender/VocadbRecommender.csproj --configuration Release --no-restore
      - name: Audit API dependencies
        shell: bash
        run: |
          report="$RUNNER_TEMP/dotnet-vulnerable-packages.txt"
          dotnet list backend/api/VocadbRecommender/VocadbRecommender.csproj package --vulnerable --include-transitive | tee "$report"
          if grep -q "has the following vulnerable packages" "$report"; then
            exit 1
          fi
      - name: Test API
        run: dotnet test backend/api/VocadbRecommender.Tests/VocadbRecommender.Tests.csproj --configuration Release --no-restore
      - name: Deployment topology contract
        run: npm run test:deployment-topology
      - name: Primary-only public topology contract
        run: npm run test:primary-topology
      - name: Transactional rolling deployment failures
        run: npm run test:rolling-deployment
      - name: Stateful service hardening transaction failures
        run: npm run test:stateful-hardening
      - name: SBC runtime contract
        run: python -B scripts/test-sbc-runtime-contract.py
      - name: Container image scan receipt contract
        run: python -B scripts/test-container-image-scan-validator.py
      - name: PostgreSQL container image contract
        run: python -B scripts/test-postgres-container-images.py
      - name: SBC Qdrant upgrade controller contract
        run: python -B scripts/test-sbc-qdrant-storage-upgrade.py
      - name: SBC API bridge receipt consumption crash recovery
        run: python -B scripts/test-sbc-api-bridge-consumption.py
      - name: Runtime health collector contract
        run: npm run test:runtime-health
      - name: Python runtime health collector contract
        run: npm run test:runtime-health:python
      - name: Database LOGIN role provisioning contract
        run: npm run test:db-role-provisioning
      - name: Migration runner integrity contract
        run: npm run test:migration-runner
      - name: Tag parent FK migration static contract
        run: npm run test:tag-parent-fk-migration
      - name: Database schema and model guard contract
        env:
          DIVA_ALLOW_DESTRUCTIVE_DB_MIGRATION_TEST: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: vocadb
          PGDATABASE: vocadb_recommender
          PGPASSWORD: diva-ci-password
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -Atc "SELECT extversion FROM pg_extension WHERE extname = 'vector'" | grep -qx '0.8.6'
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -Atc "SELECT to_regclass('public.songs') IS NOT NULL" | grep -qx t
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -f backend/database/schema.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -c "DROP INDEX song_discovery_eligible_song_idx"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -f backend/database/migrations/0021_discovery_eligible_song_lookup.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -Atc "SELECT indisvalid AND indisready FROM pg_index WHERE indexrelid = 'song_discovery_eligible_song_idx'::regclass" | grep -qx t
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -c "DROP INDEX song_artists_producer_song_idx, song_artists_vocalist_song_idx, pvs_playable_song_cover_idx"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -f backend/database/migrations/0022_recommendation_song_info_covering_indexes.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -Atc "SELECT COUNT(*) FROM pg_index WHERE indexrelid IN ('song_artists_producer_song_idx'::regclass, 'song_artists_vocalist_song_idx'::regclass, 'pvs_playable_song_cover_idx'::regclass) AND indisvalid AND indisready" | grep -qx 3
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -f backend/database/tests/recommendation_song_info_contract.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -f backend/database/migrations/0017_discovery_quality_model_guard.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -f scripts/test-discovery-quality-model-guard.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -c "CREATE TABLE IF NOT EXISTS schema_migrations (migration_id TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT now())"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -f backend/database/migrations/0018_runtime_database_roles.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -f backend/database/migrations/0018_runtime_database_roles.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -f backend/database/migrations/0025_reconcile_runtime_role_migration_history_acl.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -f scripts/test-database-role-contract.sql
          bash scripts/test-song-album-normalization.sh
          bash scripts/test-tag-parent-fk-migration.sh
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender <<'SQL'
          DROP TABLE IF EXISTS public.schema_migration_attempts;
          DROP TABLE public.schema_migrations;
          CREATE TABLE public.schema_migrations (
            migration_id TEXT PRIMARY KEY,
            applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
          );
          SQL
          cut -d'|' -f1 backend/database/migrations/migration-manifest.tsv \
            | psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender \
                -c 'COPY public.schema_migrations (migration_id) FROM STDIN'
          MIGRATIONS_SQL_DIR="$GITHUB_WORKSPACE/backend/database/migrations" sh backend/database/migrate.sh
          MIGRATIONS_SQL_DIR="$GITHUB_WORKSPACE/backend/database/migrations" sh backend/database/migrate.sh
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -f scripts/test-database-role-contract.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U vocadb -d vocadb_recommender -Atc "SELECT COUNT(*) || '|' || COUNT(*) FILTER (WHERE content_sha256 ~ '^[0-9a-f]{64}$') || '|' || (SELECT COUNT(*) FROM schema_migration_attempts WHERE status = 'running') FROM schema_migrations" | grep -qx '25|25|0'
      - name: Remove PostgreSQL CI runtime
        if: ${{ always() }}
        shell: bash
        run: |
          postgres_container="diva-player-ci-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          postgres_volume="${postgres_container}-data"
          docker rm --force "$postgres_container" >/dev/null 2>&1 || true
          docker volume rm "$postgres_volume" >/dev/null 2>&1 || true
      - name: Build
        run: npm run build
      - name: Build deployable container images
        shell: bash
        run: |
          qdrant_dockerfile_sha256=$(sha256sum backend/qdrant/Dockerfile | awk '{print $1}')
          qdrant_build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          qdrant_audit_arch=x86_64
          qdrant_busybox_sha256=f3547b3d78d08a028a4833ddb83b77cf012838c078bfd2b76355f53d1d8bba62
          qdrant_audit_contract_helper_sha256=$(sha256sum backend/qdrant/audit-contract.sh | awk '{print $1}')
          test "$qdrant_audit_contract_helper_sha256" = 05da48154d8001f2f97d707b98f4c5870c66a0909ad204adc3c6a34f7de4b6d8
          qdrant_audit_contract_sha256=$(sh backend/qdrant/audit-contract.sh \
            "$qdrant_audit_arch" "$qdrant_busybox_sha256" | sha256sum | awk '{print $1}')
          test "$qdrant_audit_contract_sha256" = ecf630ad651e1e3b53d257b0d19e1aa2e2f28e543442218f4c3992b073425a61
          docker build --pull --tag diva-player-ci-api:current backend/api
          docker build --pull --tag diva-player-ci-gateway:current backend/api-gateway
          docker build --pull --file Dockerfile.web --tag diva-player-ci-web:current .
          docker build --pull --file backend/qdrant/Dockerfile --target runtime \
            --build-arg "DIVA_QDRANT_DOCKERFILE_SHA256=$qdrant_dockerfile_sha256" \
            --build-arg "DIVA_QDRANT_BUILD_TIMESTAMP=$qdrant_build_timestamp" \
            --build-arg "DIVA_AUDIT_ARCH=$qdrant_audit_arch" \
            --build-arg "DIVA_BUSYBOX_BINARY_SHA256=$qdrant_busybox_sha256" \
            --build-arg "DIVA_AUDIT_CONTRACT_SHA256=$qdrant_audit_contract_sha256" \
            --build-arg "DIVA_AUDIT_CONTRACT_HELPER_SHA256=$qdrant_audit_contract_helper_sha256" \
            --tag diva-player-ci-qdrant:current backend/qdrant
          docker build --pull --file backend/qdrant/Dockerfile --target audit-tools \
            --build-arg "DIVA_QDRANT_DOCKERFILE_SHA256=$qdrant_dockerfile_sha256" \
            --build-arg "DIVA_QDRANT_BUILD_TIMESTAMP=$qdrant_build_timestamp" \
            --build-arg "DIVA_AUDIT_ARCH=$qdrant_audit_arch" \
            --build-arg "DIVA_BUSYBOX_BINARY_SHA256=$qdrant_busybox_sha256" \
            --build-arg "DIVA_AUDIT_CONTRACT_SHA256=$qdrant_audit_contract_sha256" \
            --build-arg "DIVA_AUDIT_CONTRACT_HELPER_SHA256=$qdrant_audit_contract_helper_sha256" \
            --tag diva-player-ci-qdrant-audit:current backend/qdrant
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 1000:1000 \
            diva-player-ci-qdrant:current --version \
            | grep -Fx 'qdrant 1.19.0'
          test "$(docker image inspect --format '{{index .Config.Labels "com.diva.qdrant.runtime-contract"}}' \
            diva-player-ci-qdrant:current)" = rootless-readonly-scratch-v3
          test "$(docker image inspect --format '{{json .Config.Cmd}}' \
            diva-player-ci-qdrant:current)" = '["--config-path","/qdrant/config/production.yaml"]'
          test "$(docker image inspect --format '{{json .Config.Env}}' \
            diva-player-ci-qdrant:current)" = '["PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin","QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/storage/snapshots","QDRANT__TELEMETRY_DISABLED=true"]'

          qdrant_smoke_volume="diva-player-ci-qdrant-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          qdrant_smoke_init="${qdrant_smoke_volume}-init"
          qdrant_smoke_container="${qdrant_smoke_volume}-runtime"
          cleanup_qdrant_smoke() {
            if [ -n "${qdrant_smoke_container:-}" ]; then
              docker rm --force "$qdrant_smoke_container" >/dev/null 2>&1 || true
            fi
            if [ -n "${qdrant_smoke_init:-}" ]; then
              docker rm --force "$qdrant_smoke_init" >/dev/null 2>&1 || true
            fi
            if [ -n "${qdrant_smoke_volume:-}" ]; then
              docker volume rm "$qdrant_smoke_volume" >/dev/null 2>&1 || true
            fi
          }
          resolve_qdrant_smoke_url() {
            local port_binding
            local port
            port_binding=$(docker port "$qdrant_smoke_container" 6333/tcp)
            if [[ "$port_binding" =~ ^127\.0\.0\.1:([0-9]+)$ ]]; then
              port=${BASH_REMATCH[1]}
            else
              echo "unexpected Qdrant smoke port binding: $port_binding" >&2
              return 1
            fi
            qdrant_smoke_url="http://127.0.0.1:$port"
          }
          trap cleanup_qdrant_smoke EXIT
          ! docker container inspect "$qdrant_smoke_init" >/dev/null 2>&1
          ! docker container inspect "$qdrant_smoke_container" >/dev/null 2>&1
          ! docker volume inspect "$qdrant_smoke_volume" >/dev/null 2>&1
          test "$(docker volume create \
            --label com.diva.qdrant.ci-smoke="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$qdrant_smoke_volume")" = "$qdrant_smoke_volume"
          docker run --name "$qdrant_smoke_init" --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --user 0:0 --mount "type=volume,src=$qdrant_smoke_volume,dst=/qdrant/storage" \
            --entrypoint /bin/chown diva-player-ci-qdrant-audit:current \
            1000:1000 /qdrant/storage
          test "$(docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --mount "type=volume,src=$qdrant_smoke_volume,dst=/qdrant/storage,readonly" \
            --entrypoint /bin/stat diva-player-ci-qdrant-audit:current \
            -c '%u:%g:%a' /qdrant/storage)" = 1000:1000:755
          qdrant_smoke_image_id=$(docker image inspect --format '{{.Id}}' \
            diva-player-ci-qdrant:current)
          qdrant_smoke_id=$(docker create --name "$qdrant_smoke_container" \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 1000:1000 --pids-limit 512 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --mount "type=volume,src=$qdrant_smoke_volume,dst=/qdrant/storage" \
            --publish 127.0.0.1::6333 diva-player-ci-qdrant:current)
          test "$(docker container inspect --format '{{.Id}}' "$qdrant_smoke_container")" \
            = "$qdrant_smoke_id"
          test "$(docker container inspect --format '{{.Image}}' "$qdrant_smoke_container")" \
            = "$qdrant_smoke_image_id"
          docker start "$qdrant_smoke_container" >/dev/null
          resolve_qdrant_smoke_url
          qdrant_smoke_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 2 \
              "$qdrant_smoke_url/readyz" >/dev/null; then
              qdrant_smoke_ready=true
              break
            fi
            if [ "$(docker container inspect --format '{{.State.Running}}' \
              "$qdrant_smoke_container")" != true ]; then
              break
            fi
            sleep 1
          done
          if [ "$qdrant_smoke_ready" != true ]; then
            docker logs "$qdrant_smoke_container" || true
            exit 1
          fi
          test "$(docker container inspect --format '{{.State.Running}}' \
            "$qdrant_smoke_container")" = true
          command -v jq >/dev/null
          curl --fail --silent --show-error --connect-timeout 2 --max-time 30 \
            --request PUT --header 'content-type: application/json' \
            --data-binary '{"vectors":{"size":4,"distance":"Cosine"}}' \
            "$qdrant_smoke_url/collections/diva_ci_smoke" \
            | jq --exit-status '.status == "ok"' >/dev/null
          curl --fail --silent --show-error --connect-timeout 2 --max-time 30 \
            --request PUT --header 'content-type: application/json' \
            --data-binary '{"points":[{"id":1,"vector":[1,0,0,0],"payload":{"probe":"primary"}},{"id":2,"vector":[0,1,0,0],"payload":{"probe":"secondary"}}]}' \
            "$qdrant_smoke_url/collections/diva_ci_smoke/points?wait=true" \
            | jq --exit-status '.status == "ok"' >/dev/null
          curl --fail --silent --show-error --connect-timeout 2 --max-time 30 \
            --request POST --header 'content-type: application/json' \
            --data-binary '{"query":[1,0,0,0],"limit":2,"with_payload":true}' \
            "$qdrant_smoke_url/collections/diva_ci_smoke/points/query" \
            | jq --exit-status \
              '.status == "ok" and (.result.points | length) == 2 and .result.points[0].id == 1' \
              >/dev/null
          qdrant_snapshot_name=$(curl --fail --silent --show-error \
            --connect-timeout 2 --max-time 60 --request POST \
            "$qdrant_smoke_url/collections/diva_ci_smoke/snapshots?wait=true" \
            | jq --exit-status --raw-output \
              'select(.status == "ok") | .result.name | select(type == "string" and length > 0)')
          case "$qdrant_snapshot_name" in
            ''|*[!A-Za-z0-9._-]*) echo "unsafe Qdrant snapshot name" >&2; exit 1 ;;
          esac
          qdrant_snapshot_path=$(docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --user 0:0 \
            --mount "type=volume,src=$qdrant_smoke_volume,dst=/qdrant/storage,readonly" \
            --entrypoint /bin/find diva-player-ci-qdrant-audit:current \
            /qdrant/storage/snapshots -type f -name "$qdrant_snapshot_name" -print)
          case "$qdrant_snapshot_path" in
            /qdrant/storage/snapshots/*/"$qdrant_snapshot_name"|/qdrant/storage/snapshots/"$qdrant_snapshot_name") ;;
            *) echo "Qdrant snapshot was not persisted under the configured path" >&2; exit 1 ;;
          esac
          docker stop --time 30 "$qdrant_smoke_container" >/dev/null
          test "$(docker container inspect --format '{{.State.Running}}' \
            "$qdrant_smoke_container")" = false
          docker start "$qdrant_smoke_container" >/dev/null
          resolve_qdrant_smoke_url
          qdrant_smoke_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 2 \
              "$qdrant_smoke_url/readyz" >/dev/null; then
              qdrant_smoke_ready=true
              break
            fi
            if [ "$(docker container inspect --format '{{.State.Running}}' \
              "$qdrant_smoke_container")" != true ]; then
              break
            fi
            sleep 1
          done
          if [ "$qdrant_smoke_ready" != true ]; then
            docker logs "$qdrant_smoke_container" || true
            exit 1
          fi
          curl --fail --silent --show-error --connect-timeout 2 --max-time 30 \
            "$qdrant_smoke_url/collections/diva_ci_smoke" \
            | jq --exit-status '.status == "ok" and .result.points_count == 2' >/dev/null
          test "$(docker container inspect --format '{{.State.Running}}' \
            "$qdrant_smoke_container")" = true
          docker stop --time 30 "$qdrant_smoke_container" >/dev/null
          docker rm "$qdrant_smoke_container" >/dev/null
          qdrant_smoke_container=
          docker rm "$qdrant_smoke_init" >/dev/null
          qdrant_smoke_init=
          docker volume rm "$qdrant_smoke_volume" >/dev/null
          qdrant_smoke_volume=
          trap - EXIT
      - name: Install pinned Trivy scanner
        shell: bash
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_ARCHIVE_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          TRIVY_BINARY_SHA256: d89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy.tar.gz"
          install_dir="$RUNNER_TEMP/trivy"
          test ! -e "$archive"
          test ! -e "$install_dir"
          curl --fail --show-error --silent --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$TRIVY_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir --mode=0700 "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" trivy
          chmod 0555 "$install_dir/trivy"
          test "$(sha256sum "$install_dir/trivy" | awk '{print $1}')" = "$TRIVY_BINARY_SHA256"
          version_output=$("$install_dir/trivy" --version)
          printf '%s\n' "$version_output"
          grep --fixed-strings --line-regexp "Version: ${TRIVY_VERSION}" <<< "$version_output"
      - name: Attest exact deployable image vulnerability scans
        shell: bash
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_ARCHIVE_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          TRIVY_BINARY_SHA256: d89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791
        run: |
          set -euo pipefail
          umask 077
          scanner="$RUNNER_TEMP/trivy/trivy"
          actual_scanner_sha256=$(sha256sum "$scanner" | awk '{print $1}')
          if [[ "$actual_scanner_sha256" != "$TRIVY_BINARY_SHA256" ]]; then
            echo "::error::The installed Trivy binary no longer matches its reviewed SHA-256."
            exit 1
          fi
          version_output=$("$scanner" --version)
          grep --fixed-strings --line-regexp "Version: ${TRIVY_VERSION}" <<< "$version_output"

          evidence_root="$RUNNER_TEMP/trivy-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache_dir="$evidence_root/cache"
          scanner_home="$evidence_root/home"
          empty_config="$evidence_root/empty-config.yaml"
          empty_ignore="$evidence_root/empty.ignore"
          test ! -e "$evidence_root"
          install -d -m 0700 "$evidence_root" "$cache_dir" "$scanner_home"
          install -m 0600 /dev/null "$empty_config"
          install -m 0600 /dev/null "$empty_ignore"
          printf '%s\n' \
            "version=$TRIVY_VERSION" \
            "archive.sha256=$TRIVY_ARCHIVE_SHA256" \
            "binary.sha256=$actual_scanner_sha256" \
            'os=linux' \
            'architecture=amd64' \
            > "$evidence_root/scanner.identity"
          chmod 0600 "$evidence_root/scanner.identity"

          # Each record is service|locally built source reference|OS family|reviewed inventory bounds.
          # Bounds aggregate package counts and also pin the number of Trivy Results per class/type.
          image_specs=(
            "api|diva-player-ci-api:current|alpine|os-pkgs:alpine:21:21:1,lang-pkgs:dotnet-core:13:13:3,lang-pkgs:nuget:12:12:1"
            "gateway|diva-player-ci-gateway:current|alpine|os-pkgs:alpine:24:24:1"
            "web|diva-player-ci-web:current|alpine|os-pkgs:alpine:70:70:1"
            "qdrant-runtime|diva-player-ci-qdrant:current|debian|os-pkgs:debian:7:7:1"
            "qdrant-audit-tool|diva-player-ci-qdrant-audit:current|alpine|os-pkgs:alpine:3:3:1"
            "pgvector-runtime|diva-player-ci-postgres:current|alpine|os-pkgs:alpine:46:46:1"
            "postgres-migrate-helper|diva-player-ci-postgres-migrate:current|alpine|os-pkgs:alpine:24:24:1"
          )
          scan_batch_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          overall_failure=0

          for spec in "${image_specs[@]}"; do
            IFS='|' read -r service source_reference os_family inventory_csv <<< "$spec"
            service_dir="$evidence_root/$service"
            install -d -m 0700 "$service_dir"
            report="$service_dir/report.json"
            receipt="$service_dir/receipt.json"

            if ! image_id=$(docker image inspect --format '{{.Id}}' "$source_reference" 2>/dev/null); then
              echo "::error::Unable to resolve the $service source reference."
              overall_failure=1
              continue
            fi
            if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$service did not resolve to an exact local image ID."
              overall_failure=1
              continue
            fi
            if [[ $(docker image inspect --format '{{.Id}}' "$image_id" 2>/dev/null) != "$image_id" ]]; then
              echo "::error::$service exact image ID cannot be resolved locally."
              overall_failure=1
              continue
            fi
            architecture=$(docker image inspect --format '{{.Architecture}}' "$image_id")
            container_os=$(docker image inspect --format '{{.Os}}' "$image_id")
            if [[ "$architecture" != amd64 || "$container_os" != linux ]]; then
              echo "::error::$service is not the reviewed linux/amd64 artifact."
              overall_failure=1
              continue
            fi

            scan_status=0
            env -i \
              HOME="$scanner_home" \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              "$scanner" image \
              --config "$empty_config" \
              --ignorefile "$empty_ignore" \
              --cache-dir "$cache_dir" \
              --image-src docker \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --format json \
              --list-all-pkgs \
              --output "$report" \
              --exit-code 1 \
              --timeout 30m \
              "$image_id" || scan_status=$?
            scan_completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            if [[ $(docker image inspect --format '{{.Id}}' "$source_reference" 2>/dev/null) != "$image_id" ]]; then
              echo "::error::$service source reference moved while its exact image ID was scanned."
              overall_failure=1
              continue
            fi
            if [[ ! -f "$report" || -L "$report" ]]; then
              echo "::error::Trivy did not create a regular $service report."
              overall_failure=1
              continue
            fi

            if [[ "$service" == qdrant-audit-tool ]]; then
              if ! python -B - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          actual = sorted(
              f"{package['Name']}={package['Version']}"
              for result in report.get("Results", [])
              for package in result.get("Packages", [])
          )
          expected = sorted([
              "busybox-binsh=1.37.0-r30",
              "busybox=1.37.0-r30",
              "musl=1.2.5-r23",
          ])
          raise SystemExit(0 if actual == expected else 1)
          PY
              then
                echo "::error::Qdrant audit image package inventory is not the exact three-package contract."
                overall_failure=1
                continue
              fi
            fi

            inventory_arguments=()
            IFS=',' read -ra inventory_bounds <<< "$inventory_csv"
            for inventory_bound in "${inventory_bounds[@]}"; do
              inventory_arguments+=(--inventory-bound "$inventory_bound")
            done

            validation_summary=
            if validation_summary=$(python -B scripts/validate-container-image-scan.py validate \
              --service "$service" \
              --expected-image-id "$image_id" \
              --expected-architecture amd64 \
              --expected-os linux \
              --expected-os-family "$os_family" \
              --report "$report" \
              --db-metadata "$cache_dir/db/metadata.json" \
              --db "$cache_dir/db/trivy.db" \
              --receipt "$receipt" \
              "${inventory_arguments[@]}" \
              --scanner-version "$TRIVY_VERSION" \
              --scanner-sha256 "$actual_scanner_sha256" \
              --scan-started-at "$scan_batch_started_at" \
              --scan-completed-at "$scan_completed_at"); then
              printf '%s\n' "$validation_summary"
            else
              echo "::error::$service scan report or receipt contract validation failed."
              overall_failure=1
              continue
            fi

            receipt_sha256=$(python -c 'import json, sys; print(json.load(sys.stdin)["receiptSha256"])' \
              <<< "$validation_summary")
            independent_receipt_sha256=$(sha256sum "$receipt" | awk '{print $1}')
            if [[ ! "$receipt_sha256" =~ ^[0-9a-f]{64}$ \
              || "$receipt_sha256" != "$independent_receipt_sha256" ]]; then
              echo "::error::$service receipt SHA-256 did not survive independent verification."
              overall_failure=1
              continue
            fi
            if [[ "$scan_status" -ne 0 ]]; then
              echo "::error::Trivy returned status $scan_status for $service despite a validated report."
              overall_failure=1
              continue
            fi

            if ! python -B scripts/validate-container-image-scan.py verify \
              --service "$service" \
              --expected-image-id "$image_id" \
              --expected-architecture amd64 \
              --expected-os linux \
              --expected-os-family "$os_family" \
              --report "$report" \
              --db-metadata "$cache_dir/db/metadata.json" \
              --db "$cache_dir/db/trivy.db" \
              --receipt "$receipt" \
              --expected-receipt-sha256 "$receipt_sha256"; then
              echo "::error::$service receipt revalidation failed."
              overall_failure=1
              continue
            fi
            if [[ $(docker image inspect --format '{{.Id}}' "$source_reference" 2>/dev/null) != "$image_id" ]]; then
              echo "::error::$service source reference moved before the receipt gate completed."
              overall_failure=1
              continue
            fi
            printf 'Validated %s as %s with receipt %s\n' \
              "$service" "$image_id" "$receipt_sha256"
          done
          exit "$overall_failure"
      - name: Preserve deployable image scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployable-image-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/trivy-deploy-${{ github.run_id }}-${{ github.run_attempt }}/scanner.identity
            ${{ runner.temp }}/trivy-deploy-${{ github.run_id }}-${{ github.run_attempt }}/cache/db/metadata.json
            ${{ runner.temp }}/trivy-deploy-${{ github.run_id }}-${{ github.run_attempt }}/*/report.json
            ${{ runner.temp }}/trivy-deploy-${{ github.run_id }}-${{ github.run_attempt }}/*/receipt.json
          if-no-files-found: warn
          retention-days: 30
      - name: Start preview server for E2E
        run: |
          npm run preview -- --host 127.0.0.1 > "$RUNNER_TEMP/diva-player-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/diva-player-preview.pid"
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/diva-player/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/diva-player-preview.log"
          exit 1
      - name: Player controls E2E
        run: npm run test:e2e:player-controls -- http://127.0.0.1:4173/diva-player/
      - name: Hidden songs E2E
        run: npm run test:e2e:hidden-songs -- http://127.0.0.1:4173/diva-player/
      - name: External players E2E
        run: npm run test:e2e:external-players -- http://127.0.0.1:4173/diva-player/
      - name: Mobile player gestures E2E
        # Retry the complete fixture once for a transient hosted-Chromium stall,
        # but keep the release blocked if the bounded retry also fails.
        run: |
          if npm run test:e2e:mobile-player-gestures -- http://127.0.0.1:4173/diva-player/; then
            exit 0
          fi
          echo "Mobile gesture E2E failed once; retrying the complete fixture after 5 seconds."
          sleep 5
          npm run test:e2e:mobile-player-gestures -- http://127.0.0.1:4173/diva-player/
      - name: YouTube playlist sync E2E
        run: npm run test:e2e:youtube-playlist-sync -- http://127.0.0.1:4173/diva-player/
      - name: NicoNico playlist sync E2E
        run: npm run test:e2e:nico-playlist-sync -- http://127.0.0.1:4173/diva-player/
      - name: Playlist management E2E
        run: npm run test:e2e:playlists -- http://127.0.0.1:4173/diva-player/
      - name: Knowledge map E2E
        run: npm run test:e2e:knowledge-map -- http://127.0.0.1:4173/diva-player/
      - name: Advanced search E2E
        run: npm run test:e2e:advanced-search -- http://127.0.0.1:4173/diva-player/
      - name: Background playback E2E
        run: npm run test:e2e:background-playback -- http://127.0.0.1:4173/diva-player/
      - name: Cloudflare proxy contract test
        run: npm run test:cloudflare-proxy
      - name: Navigation E2E
        run: npm run test:e2e:navigation -- http://127.0.0.1:4173/diva-player/
      - name: Performance budget E2E
        run: npm run test:performance-budget -- http://127.0.0.1:4173/diva-player/
      - name: Cloudflare release contract
        run: npm run test:cloudflare-release
      - name: Stop local preview server
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/diva-player-preview.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/diva-player-preview.pid")" 2>/dev/null || true
          fi
      - name: Build exact Cloudflare release once
        shell: bash
        env:
          COMPATIBILITY_DATE: ${{ needs.cloudflare_contract.outputs.compatibility_date }}
          COMPATIBILITY_FLAGS_JSON: ${{ needs.cloudflare_contract.outputs.compatibility_flags_json }}
        run: |
          npm run build:cloudflare
          node scripts/cloudflare-release-artifact.mjs build-worker \
            --compatibility-date "$COMPATIBILITY_DATE" \
            --compatibility-flags-json "$COMPATIBILITY_FLAGS_JSON"
          test -s .cloudflare-functions-build/index.js
      - name: Package Cloudflare release with provenance
        id: release_artifact
        shell: bash
        env:
          COMPATIBILITY_DATE: ${{ needs.cloudflare_contract.outputs.compatibility_date }}
          COMPATIBILITY_FLAGS_JSON: ${{ needs.cloudflare_contract.outputs.compatibility_flags_json }}
        run: |
          npm run package:cloudflare-release -- \
            --git-commit "$GITHUB_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"
          npm run verify:cloudflare-release -- \
            --expected-commit "$GITHUB_SHA" \
            --expected-compatibility-date "$COMPATIBILITY_DATE" \
            --expected-compatibility-flags-json "$COMPATIBILITY_FLAGS_JSON"
          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf cloudflare-pages-release.tar \
            .cloudflare-release
      - name: Save exact Cloudflare release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-pages-release
          path: cloudflare-pages-release.tar
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  deploy-cloudflare:
    needs: [cloudflare_contract, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          cache: 'npm'
      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Download exact Cloudflare release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cloudflare-pages-release
          path: ${{ runner.temp }}/cloudflare-pages-release
      - name: Verify downloaded release provenance
        id: verify_artifact
        shell: bash
        env:
          EXPECTED_RELEASE_SHA256: ${{ needs.build.outputs.release_sha256 }}
          COMPATIBILITY_DATE: ${{ needs.cloudflare_contract.outputs.compatibility_date }}
          COMPATIBILITY_FLAGS_JSON: ${{ needs.cloudflare_contract.outputs.compatibility_flags_json }}
        run: |
          tar -xf "$RUNNER_TEMP/cloudflare-pages-release/cloudflare-pages-release.tar" -C "$GITHUB_WORKSPACE"
          npm run verify:cloudflare-release -- \
            --expected-commit "$GITHUB_SHA" \
            --expected-sha256 "$EXPECTED_RELEASE_SHA256" \
            --expected-compatibility-date "$COMPATIBILITY_DATE" \
            --expected-compatibility-flags-json "$COMPATIBILITY_FLAGS_JSON" \
            --github-output "$GITHUB_OUTPUT"
      - name: Validate Cloudflare project release contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMPATIBILITY_DATE: ${{ needs.cloudflare_contract.outputs.compatibility_date }}
          COMPATIBILITY_FLAGS_JSON: ${{ needs.cloudflare_contract.outputs.compatibility_flags_json }}
        run: |
          node scripts/cloudflare-pages-release.mjs inspect-project \
            --project diva-player \
            --expected-compatibility-date "$COMPATIBILITY_DATE" \
            --expected-compatibility-flags-json "$COMPATIBILITY_FLAGS_JSON"
      - name: Select fixed preview branch
        run: echo "PREVIEW_BRANCH=release-candidate" >> "$GITHUB_ENV"
      - name: Capture preview deployment baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/cloudflare-pages-release.mjs capture-preview \
            --project diva-player \
            --branch "$PREVIEW_BRANCH" \
            --output "$RUNNER_TEMP/preview-before-upload.json"
      - name: Deploy exact release to isolated preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA256: ${{ needs.build.outputs.release_sha256 }}
        run: |
          # A fixed non-production alias avoids leaving one branch alias per run;
          # the API-resolved hash URL below remains immutable for verification.
          cd .cloudflare-release/payload
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" pages deploy dist \
            --project-name diva-player \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "artifact-sha256:${RELEASE_SHA256};github-run-id:${GITHUB_RUN_ID};github-run-attempt:${GITHUB_RUN_ATTEMPT}" \
            --commit-dirty=false \
            --no-bundle
      - name: Resolve immutable preview deployment
        id: preview_deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA256: ${{ needs.build.outputs.release_sha256 }}
        run: |
          node scripts/cloudflare-pages-release.mjs wait-preview \
            --project diva-player \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --release-sha256 "$RELEASE_SHA256" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --excluded-ids-file "$RUNNER_TEMP/preview-before-upload.json" \
            --attempts 8 \
            --interval-ms 5000 \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify preview root, ready, health, and origin headers
        env:
          PREVIEW_URL: ${{ steps.preview_deployment.outputs.preview_url }}
        run: npm run check:public-primary-health -- --base-url "$PREVIEW_URL" --timeout-ms 15000 --interval-ms 5000
      - name: Verify preview Nico autoplay smoke
        env:
          PREVIEW_URL: ${{ steps.preview_deployment.outputs.preview_url }}
        run: |
          if npm run test:e2e:pages-nico -- "$PREVIEW_URL"; then
            exit 0
          fi
          echo "Preview Nico autoplay smoke failed once; retrying the complete smoke after 15 seconds."
          sleep 15
          npm run test:e2e:pages-nico -- "$PREVIEW_URL"
      - name: Capture current production rollback candidate
        id: rollback_candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/cloudflare-pages-release.mjs capture-production \
            --project diva-player \
            --output "$RUNNER_TEMP/last-known-good-production.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify rollback candidate through production URLs
        run: |
          npm run check:public-primary-health -- \
            --base-url https://diva-player.pages.dev \
            --timeout-ms 15000 \
            --interval-ms 5000
          if npm run test:e2e:pages-nico -- https://diva-player.pages.dev/; then
            exit 0
          fi
          echo "Current production Nico autoplay smoke failed once; retrying after 15 seconds."
          sleep 15
          npm run test:e2e:pages-nico -- https://diva-player.pages.dev/
      - name: Seal verified last-known-good production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_DEPLOYMENT_ID: ${{ steps.rollback_candidate.outputs.production_deployment_id }}
        run: |
          node scripts/cloudflare-pages-release.mjs assert-production \
            --project diva-player \
            --expected-id "$ROLLBACK_DEPLOYMENT_ID"
      - name: Deploy the same verified release to production
        id: production_deploy
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA256: ${{ needs.build.outputs.release_sha256 }}
          COMPATIBILITY_DATE: ${{ needs.cloudflare_contract.outputs.compatibility_date }}
          COMPATIBILITY_FLAGS_JSON: ${{ needs.cloudflare_contract.outputs.compatibility_flags_json }}
        run: |
          npm run verify:cloudflare-release -- \
            --expected-commit "$GITHUB_SHA" \
            --expected-compatibility-date "$COMPATIBILITY_DATE" \
            --expected-compatibility-flags-json "$COMPATIBILITY_FLAGS_JSON"
          cd .cloudflare-release/payload
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" pages deploy dist \
            --project-name diva-player \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "artifact-sha256:${RELEASE_SHA256};github-run-id:${GITHUB_RUN_ID};github-run-attempt:${GITHUB_RUN_ATTEMPT}" \
            --commit-dirty=false \
            --no-bundle
      - name: Verify production or perform one bounded rollback
        if: ${{ always() && (steps.production_deploy.outcome == 'success' || steps.production_deploy.outcome == 'failure') }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA256: ${{ needs.build.outputs.release_sha256 }}
          ROLLBACK_DEPLOYMENT_ID: ${{ steps.rollback_candidate.outputs.production_deployment_id }}
          PRODUCTION_DEPLOY_OUTCOME: ${{ steps.production_deploy.outcome }}
        run: |
          set +e
          verification_failed=0
          new_deployment_seen=0
          if [[ "$PRODUCTION_DEPLOY_OUTCOME" != "success" ]]; then
            echo "Production upload command failed; canonical state will be reconciled before rollback."
            verification_failed=1
          fi

          if node scripts/cloudflare-pages-release.mjs wait-production \
            --project diva-player \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --release-sha256 "$RELEASE_SHA256" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --excluded-id "$ROLLBACK_DEPLOYMENT_ID" \
            --attempts 8 \
            --interval-ms 5000 \
            --output "$RUNNER_TEMP/new-production.json"; then
            new_deployment_seen=1
          else
            verification_failed=1
          fi

          npm run check:public-primary-health -- \
            --base-url https://diva-player.pages.dev \
            --timeout-ms 15000 \
            --interval-ms 5000 || verification_failed=1

          if ! npm run test:e2e:pages-nico -- https://diva-player.pages.dev/; then
            echo "Production Nico autoplay smoke failed once; retrying after 15 seconds."
            sleep 15
            npm run test:e2e:pages-nico -- https://diva-player.pages.dev/ || verification_failed=1
          fi

          if [[ "$verification_failed" -eq 0 ]]; then
            echo "Cloudflare production release ${RELEASE_SHA256} verified." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$new_deployment_seen" -eq 0 ]]; then
            if node scripts/cloudflare-pages-release.mjs assert-production \
              --project diva-player \
              --expected-id "$ROLLBACK_DEPLOYMENT_ID"; then
              echo "Production upload failed or did not converge; verified last-known-good remained canonical, so rollback was unnecessary." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          echo "::error::Production verification failed; requesting one rollback to the verified deployment ${ROLLBACK_DEPLOYMENT_ID}."
          node scripts/cloudflare-pages-release.mjs rollback-production \
            --project diva-player \
            --target-file "$RUNNER_TEMP/last-known-good-production.json" \
            --attempts 8 \
            --interval-ms 5000 \
            --output "$RUNNER_TEMP/rollback-result.json"
          rollback_api_status=$?
          if [[ "$rollback_api_status" -ne 0 ]]; then
            echo "Cloudflare rollback API failed; no second rollback was attempted." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          rollback_verification_failed=0
          npm run check:public-primary-health -- \
            --base-url https://diva-player.pages.dev \
            --timeout-ms 15000 \
            --interval-ms 5000 || rollback_verification_failed=1
          if ! npm run test:e2e:pages-nico -- https://diva-player.pages.dev/; then
            echo "Rolled-back Nico autoplay smoke failed once; retrying after 15 seconds."
            sleep 15
            npm run test:e2e:pages-nico -- https://diva-player.pages.dev/ || rollback_verification_failed=1
          fi

          if [[ "$rollback_verification_failed" -eq 0 ]]; then
            echo "Production verification failed; verified rollback to ${ROLLBACK_DEPLOYMENT_ID} completed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production verification failed and the restored deployment did not pass bounded smoke verification." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
