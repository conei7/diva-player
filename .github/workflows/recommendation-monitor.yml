name: Recommendation regression monitor

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/recommendation-monitor.yml'
      - 'scripts/test-recommendation-regression.mjs'
      - 'scripts/test-recommendation-regression-report.mjs'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: recommendation-regression-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recommendation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test recommendation report diagnostics
        run: npm run test:recommendation-regression-report
      - name: Check deployed recommendation API
        run: |
          for attempt in 1 2; do
            if npm run test:recommendation-regression -- --base-url https://diva-player.pages.dev/backend-api --report-file recommendation-regression-report.json; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "Transient failure; retrying the complete public check in 20 seconds."
              sleep 20
            fi
          done
          exit 1
      - name: Save recommendation regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recommendation-regression-report
          path: recommendation-regression-report.json
          if-no-files-found: ignore
          retention-days: 14
