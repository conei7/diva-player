name: Recommendation regression monitor

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/recommendation-monitor.yml'
      - 'scripts/test-recommendation-regression.mjs'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: recommendation-regression-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recommendation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check deployed recommendation API
        run: npm run test:recommendation-regression -- --base-url https://diva-player.pages.dev/backend-api
