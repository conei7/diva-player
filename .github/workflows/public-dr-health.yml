name: Public primary health monitor

on:
  schedule:
    # GitHub documents that jobs queued at the start of an hour can be
    # delayed or dropped under load. Keep the 15-minute cadence while avoiding
    # minute zero so this primary-only external monitor is less likely to be discarded.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy DIVA Player']
    types: [completed]

concurrency:
  group: public-primary-health-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  public-primary-health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
      - name: Allow Pages edges to converge after deploy
        if: github.event_name == 'workflow_run'
        run: sleep 60
      - name: Probe public Web and primary API paths twice
        run: npm run check:public-primary-health -- --report-file public-primary-health-report.json
      - name: Save sanitized public primary health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-primary-health-report
          path: public-primary-health-report.json
          if-no-files-found: ignore
          retention-days: 14
