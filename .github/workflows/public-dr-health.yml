name: Public primary health monitor

on:
  schedule:
    # GitHub documents that jobs queued at the start of an hour can be
    # delayed or dropped under load. Keep the 15-minute cadence while avoiding
    # minute zero so this primary-only external monitor is less likely to be discarded.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      discord_test:
        description: Send a TEST ONLY message with synthetic incident and recovery entries
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: ['Deploy DIVA Player']
    types: [completed]

concurrency:
  group: public-primary-health-monitor
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  public-primary-health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
      - name: Allow Pages edges to converge after deploy
        if: github.event_name == 'workflow_run'
        run: sleep 60
      - name: Download the latest persistent notification state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public-primary-state
          previous_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/public-dr-health.yml/runs?status=completed&per_page=100" --jq '.workflow_runs[0].id // empty')"
          if [ -n "$previous_run_id" ]; then
            gh run download "$previous_run_id" --name public-primary-health-notification-state --dir public-primary-state || true
          fi
          if [ -f public-primary-state/public-primary-health-state.json ]; then
            cp public-primary-state/public-primary-health-state.json public-primary-health-state.json
          fi
      - name: Probe public Web and primary API paths twice
        id: probe
        continue-on-error: true
        run: npm run check:public-primary-health -- --report-file public-primary-health-report.json --allow-degraded-data
      - name: Notify Discord on confirmed incident or recovery
        id: notify
        if: always()
        env:
          DIVA_ALERT_WEBHOOK_URL: ${{ secrets.DIVA_ALERT_WEBHOOK_URL }}
          DIVA_PUBLIC_HEALTH_DISCORD_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.discord_test == true }}
        run: >-
          node scripts/notify-public-health.mjs
          --report-file public-primary-health-report.json
          --state-file public-primary-health-state.json
          --result-file public-primary-health-result.json
      - name: Save sanitized public health state and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-primary-health-notification-state
          path: |
            public-primary-health-report.json
            public-primary-health-state.json
            public-primary-health-result.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve monitoring failure status
        if: always()
        shell: bash
        run: |
          if [ ! -f public-primary-health-result.json ]; then
            echo "Public health state could not be saved"
            exit 1
          fi
          node -e 'const r=require("./public-primary-health-result.json"); if (!r.reportOk || r.notificationStatus === "pending" || r.testNotificationStatus === "pending") process.exit(1);'
