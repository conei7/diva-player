name: Public DR health monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy DIVA Player']
    types: [completed]

concurrency:
  group: public-dr-health-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  public-dr-health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
      - name: Probe public Web and DR API paths twice
        run: npm run check:public-dr-health -- --report-file public-dr-health-report.json
      - name: Save sanitized public DR health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-dr-health-report
          path: public-dr-health-report.json
          if-no-files-found: ignore
          retention-days: 14
